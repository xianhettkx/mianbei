 '高薪 + 零门槛 + 急招 + 要求出境，是典型诈骗广告特征。',null,[['留下联系方式，了解一下',null],['觉得可疑，先关掉',()=>say([X('……可是下个月的房租怎么办。'),X('算了，只是问问，又不会损失什么。')],'有侥幸心理，正是骗子最想利用的。看到高薪广告，先核实再行动。')]])}

 if(e.adv){if(dtxt<d.t.length)dtxt=d.t.length;else if(di<dq.length-1){di++;dtxt=0}else if(dchoice){inCh=1;sel=0}else endDlg(dcb)}}

function step(dt,a,e){
 T+=dt;toastT-=dt;banner-=dt;

 play(dt,a,e)}

function play(dt,a,e){
 const L=LV[lv];
 if(need){if(!a.l&&!a.j&&!a.r)need=0;a={...a,l:0,r:0,j:0,i:0};e={...e,j:0,i:0}}
 const t=(a.r?1:0)-(a.l?1:0);P.vx+=(t*190-P.vx)*Math.min(1,dt*12);if(t)P.f=t;
